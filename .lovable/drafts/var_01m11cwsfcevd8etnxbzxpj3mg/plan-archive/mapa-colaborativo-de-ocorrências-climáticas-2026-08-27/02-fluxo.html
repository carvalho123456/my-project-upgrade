<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); width:100%; height:auto">
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="hsl(var(--muted-foreground))"/>
    </marker>
  </defs>
  <style>
    .lbl{fill:hsl(var(--foreground));font-size:14px;font-weight:480}
    .sub{fill:hsl(var(--muted-foreground));font-size:12px}
    .bx{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1;rx:8}
    .w{stroke:hsl(var(--muted-foreground));stroke-width:1;fill:none;marker-end:url(#ar)}
    .zone{fill:none;stroke:hsl(var(--border));stroke-width:1;stroke-dasharray:4 3;rx:8}
    .tag{fill:hsl(var(--border));font-size:11px}
  </style>

  <rect class="zone" x="8" y="8" width="624" height="120"/>
  <text class="tag" x="20" y="26">ciclo do alerta</text>

  <rect class="bx" x="26" y="40" width="120" height="56"/>
  <text class="lbl" x="86" y="64" text-anchor="middle">Relato</text>
  <text class="sub" x="86" y="82" text-anchor="middle">tipo · ponto · nível</text>

  <rect class="bx" x="186" y="40" width="120" height="56"/>
  <text class="lbl" x="246" y="64" text-anchor="middle">No mapa</text>
  <text class="sub" x="246" y="82" text-anchor="middle">marcador + cor</text>

  <rect class="bx" x="346" y="40" width="120" height="56"/>
  <text class="lbl" x="406" y="64" text-anchor="middle">Confirmações</text>
  <text class="sub" x="406" y="82" text-anchor="middle">continua / melhorou</text>

  <rect x="506" y="40" width="110" height="56" rx="28" fill="hsl(var(--accent))" stroke="none"/>
  <text x="561" y="64" text-anchor="middle" style="fill:hsl(var(--accent-foreground));font-size:14px;font-weight:480">Confiança</text>
  <text x="561" y="82" text-anchor="middle" style="fill:hsl(var(--accent-foreground));font-size:12px">0 – 100</text>

  <line class="w" x1="146" y1="68" x2="180" y2="68"/>
  <line class="w" x1="306" y1="68" x2="340" y2="68"/>
  <line class="w" x1="466" y1="68" x2="500" y2="68"/>

  <path class="w" d="M561 96 L561 116 L246 116 L246 100" stroke-dasharray="4 3"/>
  <text class="sub" x="400" y="132" text-anchor="middle">recalcula a cada relato, confirmação e a cada minuto</text>

  <rect class="zone" x="8" y="160" width="624" height="128"/>
  <text class="tag" x="20" y="178">decaimento no tempo</text>

  <line x1="40" y1="256" x2="600" y2="256" stroke="hsl(var(--border))" stroke-width="1"/>
  <rect x="40" y="212" width="150" height="40" rx="8" fill="hsl(var(--muted))" stroke="none"/>
  <rect x="190" y="222" width="180" height="30" rx="8" fill="hsl(var(--muted))" stroke="none"/>
  <rect x="370" y="234" width="150" height="18" rx="8" fill="hsl(var(--muted))" stroke="none"/>
  <text class="lbl" x="115" y="237" text-anchor="middle">ativo</text>
  <text class="lbl" x="280" y="243" text-anchor="middle">esmaecendo</text>
  <text class="sub" x="445" y="247" text-anchor="middle">expirado</text>
  <text class="sub" x="560" y="247" text-anchor="middle">arquivado</text>
  <text class="sub" x="115" y="274" text-anchor="middle">0 – TTL do tipo</text>
  <text class="sub" x="280" y="274" text-anchor="middle">até 2× TTL</text>
  <text class="sub" x="500" y="274" text-anchor="middle">sai do mapa, fica no histórico</text>
</svg>
