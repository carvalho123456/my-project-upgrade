<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); width:100%; height:auto">
  <style>
    .lbl{fill:hsl(var(--foreground));font-size:14px;font-weight:480}
    .sub{fill:hsl(var(--muted-foreground));font-size:12px}
    .bx{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1}
    .g{fill:hsl(var(--border))}
    .surf{fill:hsl(var(--muted))}
    .tag{fill:hsl(var(--border));font-size:11px}
  </style>

  <!-- mapa -->
  <rect class="bx" x="8" y="8" width="390" height="300" rx="8"/>
  <text class="tag" x="20" y="26">mapa colaborativo</text>
  <rect class="surf" x="20" y="36" width="366" height="230" rx="8"/>
  <!-- filtros -->
  <rect class="g" x="30" y="46" width="64" height="18" rx="9"/>
  <rect class="g" x="100" y="46" width="52" height="18" rx="9"/>
  <rect class="g" x="158" y="46" width="46" height="18" rx="9"/>
  <text class="sub" x="215" y="59">filtros: tipo · nível · período · bairro</text>
  <!-- vias coloridas -->
  <path d="M40 200 C120 180 160 130 240 120" stroke="hsl(var(--muted-foreground))" stroke-width="4" fill="none" opacity="0.35"/>
  <path d="M60 250 C140 240 200 210 340 205" stroke="hsl(var(--muted-foreground))" stroke-width="4" fill="none" opacity="0.2"/>
  <circle cx="150" cy="150" r="34" fill="hsl(var(--accent))" opacity="0.25"/>
  <circle cx="150" cy="150" r="11" fill="hsl(var(--accent))"/>
  <text x="150" y="154" text-anchor="middle" style="fill:hsl(var(--accent-foreground));font-size:10px">1</text>
  <circle cx="270" cy="200" r="10" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1.5"/>
  <circle cx="310" cy="110" r="10" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1.5"/>
  <!-- legenda -->
  <rect class="bx" x="20" y="276" width="366" height="22" rx="8"/>
  <text class="sub" x="32" y="291">legenda: amarelo atenção · laranja risco elevado · vermelho grave</text>

  <!-- painel detalhe -->
  <rect class="bx" x="412" y="8" width="220" height="176" rx="8"/>
  <text class="tag" x="424" y="26">detalhe do alerta</text>
  <text class="lbl" x="424" y="50">Alagamento</text>
  <rect class="g" x="424" y="60" width="80" height="14" rx="7"/>
  <rect class="g" x="424" y="80" width="180" height="8" rx="4"/>
  <rect class="g" x="424" y="94" width="150" height="8" rx="4"/>
  <text class="sub" x="424" y="120">há 40 min · 5 confirmações</text>
  <text class="sub" x="424" y="138">confiabilidade alta</text>
  <rect x="424" y="148" width="86" height="24" rx="8" fill="hsl(var(--primary))"/>
  <text x="467" y="164" text-anchor="middle" style="fill:hsl(var(--primary-foreground));font-size:12px">Continua</text>
  <rect class="bx" x="518" y="148" width="86" height="24" rx="8"/>
  <text class="sub" x="561" y="164" text-anchor="middle">Melhorou</text>

  <!-- form -->
  <rect class="bx" x="412" y="196" width="220" height="112" rx="8"/>
  <text class="tag" x="424" y="214">novo relato</text>
  <rect class="g" x="424" y="224" width="60" height="20" rx="8"/>
  <rect class="g" x="490" y="224" width="60" height="20" rx="8"/>
  <rect class="g" x="556" y="224" width="48" height="20" rx="8"/>
  <rect class="g" x="424" y="252" width="180" height="8" rx="4"/>
  <rect class="g" x="424" y="266" width="140" height="8" rx="4"/>
  <rect x="424" y="280" width="180" height="20" rx="8" fill="hsl(var(--primary))"/>
  <text x="514" y="294" text-anchor="middle" style="fill:hsl(var(--primary-foreground));font-size:12px">Enviar relato</text>
</svg>
